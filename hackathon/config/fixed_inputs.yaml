# Fixed inputs for the GEMINI agentic geothermal design hackathon.
#
#   fact_sheet:   copied from the organisers' "Required Inputs" document. Do not change.
#   assumptions:  our engineering choices. Each has a value, a basis and a status:
#                   confirmed  = decided by the owner (see notes/decisions.md)
#                   default    = proposed, not yet decided
#                 `uncertainty` gives the range used in the uncertainty analysis.
#   design_variables: the only things the agent may choose.

fact_sheet:
  reservoir:
    midpoint_depth_m: 2500          # m TVD
    gross_thickness_m: 100
    geothermal_gradient_c_per_km: 30
    surface_temperature_c: 12
    pressure_bar: 250               # bar(g) at the 2,500 m midpoint (hard data)
    permeability_md: 200
  brine:
    density_kg_m3: 1030             # reference constant
    viscosity_pa_s: 0.40e-3         # reference constant
    glr_nm3_per_m3: 0.8             # potentially liberated gas, 0 C and 1.01325 bar(a)
    gas_ch4_mol_frac: 0.80
    gas_co2_mol_frac: 0.20
    composition: "fixed baseline; variable PVT optional"
  constraints:
    doublets_min: 1
    doublets_max: 3
    flow_max_m3h: 300               # per doublet, hard challenge cap
    flow_min_m3h: 50                # per doublet while active, hard challenge cap
    brine_cooling_max_c: 40         # hard challenge cap; producer to injector (temperature drop)
    pump_hydraulic_efficiency: 0.70 # simplified; used for producer and injector pumps
    volume_balance: equal           # same reservoir; equal liquid volumes
    geothermal_operating_days: 330  # per doublet; daily power and energy balance
  supply:
    heating_supply_c: 100           # fixed
    cooling_supply_c: 20            # fixed
  demand_files:
    heating: data/gemini_heating_demand_daily_2027.csv
    cooling: data/gemini_cooling_demand_daily_2027.csv

organiser_clarifications:
  - "330 days is availability of the geothermal source, not the system. The full system must meet demand on all 365 days."
  - "Changing well depth is allowed: hydrostatic reservoir pressure and the gradient for temperature."
  - "Doublets may have separate maintenance periods, or one doublet plus backup equipment. Part of the solution."
  - "Return temperatures are our choice, as long as no constraint is violated."

assumptions:
  # A1
  brine_cp_j_kgk:
    value: 4217
    basis: "GEMINI PVTConstantSTP default; water at ~100 C is 4,216 J/kgK. NaCl content unknown, so the water value is used."
    status: confirmed
  # A2 is a fact-sheet reading, recorded here for traceability
  brine_cooling_reading:
    value: "temperature_drop_producer_to_injector"
    basis: "Fact sheet status column: 'hard challenge cap; producer to injector'. Organiser: 'how much you can cool down the brine'."
    status: confirmed
  # A3
  reservoir_pressure_vs_depth:
    value: "anchored_hydrostatic"
    basis: "250 bar at 2,500 m is hard data; other depths: 250 bar + rho*g*(z - 2500), per the organisers' hydrostatic instruction."
    status: confirmed
  # A4
  injector_reservoir_pressure:
    value: "same_as_producer"
    basis: "Fact sheet: same reservoir; equal liquid volumes."
    status: confirmed
  # A5 (base value; the agent chooses within design_variables.heating_return_c and must report sensitivity)
  heating_return_c:
    value: 60
    basis: "Base case only. Return temperature is the participant's choice (organiser). Agent chooses 45-70 C and reports the final design's sensitivity across that range."
    status: confirmed
  # A6 (documented, not used in calculations: chiller option 1, fixed COP)
  cooling_return_c:
    value: 26
    basis: "20 C supply with a 6 K loop. Documentation only; chillers use fixed COP (owner decision: option 1, thermodynamic trend later if time allows)."
    status: confirmed
  # A7
  wellhead_pressure_bar:
    value: 10
    basis: "Keeps brine pressurised to the separator. Total pump power is insensitive (~0.71 MW at 300 m3/h for 3-15 bar)."
    status: confirmed
  gas_liberation_fraction:
    value: 1.0
    basis: "Fact sheet defines GLR as potentially liberated gas; full liberation is an upper bound."
    status: confirmed
    uncertainty: [0.5, 1.0]
  # A8
  doublet_well_spacing_m:
    value: 1500
    basis: "Typical doublet spacing at reservoir level; sets PI (r_e = spacing/2) and thermal breakthrough time."
    status: confirmed
  doublet_lifetime_years:
    value: 30
    basis: "Technical lifetime of a doublet ~30 years (Masterplan Aardwarmte in Nederland)."
    status: confirmed
  rock_grain_cp_j_kgk:
    value: 730
    basis: "Quartz-dominated sandstone (owner)."
    status: confirmed
  rock_grain_density_kg_m3:
    value: 2650
    basis: "Quartz grain density (owner)."
    status: confirmed
  porosity:
    value: 0.15
    basis: "Pragmatic case; Groningen/Slochteren core and field studies 14.6-18.9% (owner)."
    status: confirmed
    uncertainty: [0.146, 0.189]
  # A9 (well designs: diameter now, max flow and CAPEX factor from economics references)
  well_designs:
    value:
      slim:     {inner_diameter_m: 0.1778, max_flow_m3h: null, capex_factor: null}
      standard: {inner_diameter_m: 0.2159, max_flow_m3h: 300,  capex_factor: 1.0}
      large:    {inner_diameter_m: 0.2445, max_flow_m3h: 300,  capex_factor: null}
    basis: "Slim 7 in, standard 8.5 in, large 9 5/8 in. Friction from GEMINI DPDT; null values come from the economics references."
    status: confirmed
  default_well_design:
    value: standard
    basis: "Used when the agent does not choose."
    status: confirmed
  # A10
  skin:
    value: 0
    basis: "Base case: undamaged well."
    status: confirmed
    uncertainty: null               # range to be set with the uncertainty analysis
  # A11
  ch4_lhv_mj_per_nm3:
    value: 35.8
    basis: "Methane LHV at 0 C, 1.01325 bar."
    status: confirmed
  # A12
  boiler_efficiency:
    value: 0.90
    basis: "Non-condensing gas boiler on LHV; little condensation with a 45-70 C return."
    status: confirmed
  # A13 removed: ambient air is not used with fixed-COP chillers (owner decision, option 1)

design_variables:              # what the agent is allowed to choose
  well_depth_m: [2000, 4000]
  n_doublets: [1, 3]
  flow_m3h_per_doublet: [50, 300]
  heating_return_c: [45, 70]
  well_design: [slim, standard, large]
  heat_pump_capacity_mwth: [0, 30]
  chiller_type: [absorption_single_effect, adsorption, electric]
  chiller_capacity_mwcool: [0, 12]
  backup_boiler_capacity_mwth: [0, 30]
  outage_schedule: [simultaneous, staggered]
