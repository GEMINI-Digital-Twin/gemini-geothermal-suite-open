# LLM routes for the agent. API keys are read from hackathon/.env, never from here.
#
# Both routes use the OpenAI-compatible /chat/completions endpoint with tool calling.
# Check the exact model ids in Google AI Studio and with `ollama list` before running.

routes:
  local:
    base_url: http://localhost:11434/v1
    model: qwen3.5:4b            # owner pulled qwen3.5:4b and qwen3.5:9b; switch with --local-model
    api_key_env: null            # Ollama needs no key
    price_in_per_mtok_usd: 0.0
    price_out_per_mtok_usd: 0.0
    timeout_s: 1800              # method choice: CPU steps reached >5 min at ~15k prompt tokens (run 1b)
  api:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3-flash        # placeholder: copy the exact id from AI Studio
    api_key_env: GEMINI_API_KEY  # line in hackathon/.env: GEMINI_API_KEY=...
    price_in_per_mtok_usd: 0.50  # BenchLM Gemini API pricing (Jul 2026), Gemini 3 Flash; cost estimate only
    price_out_per_mtok_usd: 3.00
    timeout_s: 300               # method choice

# hybrid: API for planning, for the step after a hard violation, and for the final
#         comparison; local for routine tool steps.
# api_only / local_only: one route for everything (use one fixed mode for recorded runs).
routing: hybrid
max_iterations: 30               # method choice: step cap per run
budget_usd_per_run: 0.50         # owner budget guard (EUR 10 total); loop stops above this
temperature: 0.2                 # method choice: low randomness for reproducible runs
