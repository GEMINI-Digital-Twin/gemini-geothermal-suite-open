  - id: UQ-MC
    title: Monte Carlo settings and statistics (TL-15)
    value:
      samples: 200
      seed: 2026
      sampling: latin_hypercube
      percentiles: {p10: 10, p50: 50, p90: 90}
      driver_ranking: spearman_rank_correlation
      top_drivers: 8
      robust_backup_percentile: 90
    unit: null
    justification: >-
      Spec §9.3 UQ-01/UQ-02: ≥ 200 fast-mode samples; P10/P50/P90 are the 10th/50th/90th percentiles of the
      sampled KPI (P10 = low value, not an exceedance probability); probability of meeting demand = share of
      samples (failed samples included) with zero unmet heating and cooling; dominant risk drivers = inputs
      ranked by |Spearman ρ| with each KPI. Fixed seed ⇒ identical samples and results (OPT-03 spirit).
      KPISet.min_constraint_margins of the TL-15 result is the smallest margin over the base run and all
      successful samples (the robustness view); the base run's own margins stay in the base KPIs. The peak
      boiler and electric chiller are last in the merit order and cap-only, so a sample's required nameplate
      is the installed one plus its largest day-average unmet MW; robust_backup_mw = the 90th percentile
      of that requirement (rounded up to OPT-SPACE size_resolution_mw), re-run on the base year to price the
      robustness. The tornado ranks inputs by the LCOH + LCOC swing; unmet demand is reported per bar, not
      mixed into the swing through the OPT-OBJ penalty.
    source: GEOAGENT_DESIGN_SPEC §9.3 UQ-01, UQ-02 [A]
    sensitivity: "More samples narrow the percentile estimates (≈ ±3 percentile points at 200)."
    tag: A
    status: default
    added_by: WP-11

  - id: RUN-BUDGET
    title: Search budgets of the real tools for evals and CI smoke runs (TL-13/TL-15 effort only)
    value:
      full: {}
      quick: {own_point_only: true, top_k: 1, popsize: 1, maxiter: 1, maxiter_outage: 1, dispatch_search: false, storage_scan: false, mc_samples: 12, one_at_a_time: false}
      smoke: {own_point_only: true, max_concepts: 1, top_k: 1, popsize: 1, maxiter: 0, maxiter_outage: 0, dispatch_search: false, storage_scan: false, mc_samples: 2, one_at_a_time: false, uq_cases: false, day_step: 30, workers: 1}
    unit: null
    justification: >-
      Runtime only: the same real tools (never stubs) with a smaller search. full = the register values
      (OPT-SPACE, OPT-DE, UQ-MC) on every CPU — the submitted run (scripts/build_results.py). quick = evals
      (run_eval.py): the candidate's own doublet count and verifiable depth, one DE generation, 12 Monte Carlo
      samples, sensitivity cases kept (S6). smoke = CI and the pytest end-to-end run: one concept sized, the
      DE initial population only, 2 samples, every 30th day of the DB-30 year (economics then cover those
      days only, so its KPIs are not design results), one process (no worker pool). Keys absent from a
      budget take the full value; workers absent = all CPUs. Selected with `cli run --budget` (or the
      GEOAGENT_BUDGET environment variable).
    source: WP-14 (CI time limit; engineering values stay in OPT-SPACE, OPT-DE, UQ-MC)
    sensitivity: "Smaller budgets find a worse optimum and wider percentile error; never used for reported results."
    tag: A
    status: default
    added_by: WP-14

  - id: OPT-ROBUST-BACKUP
    title: Install the TL-15 robust backup nameplates (DR-11 recommendation)
    value:
      recommend: robust
      robust_backup_percentile: 90
    unit: null
    justification: >-
      The peak boiler and the electric chiller are the backup units of the plant (last in the WP-07 merit
      order, cap-only). TL-13 sizes them to the largest daily output of the single DB-30 design year
      (OPT-SPACE), i.e. with no reserve; peak/backup-reserve practice sizes backup capacity for the design
      condition plus the uncertainty of the base load, not for one deterministic year. TL-15 (UQ-MC) gives
      that evidence per run: the share of Monte Carlo samples meeting demand with the installed nameplates
      (probability_demand_met) and with robust_backup_mw = the robust_backup_percentile of each sample's
      required nameplate (probability_demand_met_robust). Rule (DR-11, after P8): recommend installing
      robust_backup_mw when it is larger than an installed backup, raises the probability of meeting demand,
      and the variant passes the guard and meets demand on every base-year day; otherwise recommend the
      installed backups. The variant is re-simulated (TL-12 fast year, plus the full year when the selected
      design has one, so both rest on the same basis) and re-priced with TL-14 (capex, fuel, O&M of the added
      nameplate); the DesignVerifier then verifies it in P9 (golden rule 3). Evidence that motivated the
      entry (WP-14 final policy run, C2-opt): demand met in 46 % of 200 samples with the installed 5.0 MW
      boiler, 90 % with the P90 10.9 MW boiler, at about +2 USD/MWh LCOH and unchanged LCOC.
      recommend: robust | installed (the DR-11 option the rule recommends; the engine may choose the other
      option on an offered criterion). robust_backup_percentile must equal UQ-MC robust_backup_percentile
      (the percentile TL-15 computed robust_backup_mw at; checked by the tool).
    source: GEOAGENT_DESIGN_SPEC §9.3 UQ-01/UQ-02 (probability of meeting demand); UQ-MC; OPT-SPACE; user decision (pre-L-2, 2026-11-02) [A]
    sensitivity: "recommend: installed keeps the TL-13 base-year backups (lower cost, lower probability of meeting demand); a lower percentile buys less robustness for less capex."
    tag: A
    status: default
    added_by: Pre-L-2
  - id: CFG-BASIS-CONFIRM
    title: Requested supply temperature off the design basis (DB-16/DB-17) — confirm before P1
    value: keep
    unit: null
    justification: >-
      Spec §12 S5: a request such as "supply heating at 120 °C" conflicts with the 100 °C heating supply
      (DB-16) or the 20 °C cooling supply (DB-17), which are hard limits of this run (CLAUDE.md rule 4).
      The P0 intake records the conflict (CONFLICT event); P1 then asks the user to confirm the change of
      basis before any tool runs. Default "keep": the design continues on the design basis (the assumed
      answer in --input-mode assume, as in the final run). "change": the run stops (escalation) because a
      change of basis needs new limits in config/limits.yaml and config/design_basis.yaml and a new run; the
      runner never silently designs for a supply temperature outside the limits.
    source: GEOAGENT_DESIGN_SPEC §12 S5; §2.4 DB-16, DB-17; CLAUDE.md golden rule 4 [A]
    sensitivity: "change stops the run (ESCALATED) instead of continuing; no design value depends on the entry."
    tag: A
    status: default
    added_by: WP-13 follow-up
  - id: CFG-INPUT-DEFAULTS
    title: Challenge inputs the request does not provide — use the repository defaults
    value: repository defaults
    unit: null
    justification: >-
      Spec §12 S2: a request written without the challenge files ("Design a geothermal heating system for
      30 MW") provides none of the demand CSVs, the cooling demand or the reservoir data. The P0 intake lists
      which of the three the request text lacks (agents/scope.missing_request_inputs; the default brief
      comes with every file and is never asked); P1 asks ONE question that names them and offers the
      repository defaults — the design basis in config/ (design_basis.yaml, limits.yaml, climate_nl.yaml)
      and the demand CSVs in data/demand/ — before anything is loaded or assumed. Default "repository
      defaults" is the assumed answer in --input-mode assume; other inputs must be placed in those paths
      before a new run (the runner reads no other location).
    source: GEOAGENT_DESIGN_SPEC §12 S2; §2.4 (design basis files); README "Where the evidence is" [A]
    sensitivity: "n/a: the answer selects the input files; the design values come from the files themselves."
    tag: A
    status: default
    added_by: WP-13 follow-up
