      Design outlets: district min(T_wh − approach, 100 °C), brine max(T_wh − 40 K, 55 °C + approach); the district
      flow closes the balance (balanced flows at 85 °C brine: 82.2/58 °C). Approach 3 K and U 4.0 kW/m²K are the
      card's [A] defaults; NTU per pass ≤ 4 and 3.5 psi (24 kPa) per NTU from Guidebook p.221; titanium plates for
      saline brine (RC-03, RC-12).
