  - id: CHP-EL-FRAC
    title: CHP electrical share of the useful output (GEMINI chp.py vs DEA gas engine)
    value: 0.3333
    unit: "-"
    justification: >-
      Choice: simulations keep GEMINI chp.py's default — P_el = 1/3 and P_th = 2/3 of efficiency_factor ×
      fuel power (class constant; since WP-11 an optional electrical_fraction parameter, written by TL-09
      only when this entry differs from 1/3). The DEA 1–10 MW_e gas engine has η_e 0.48 and C_b 0.99
      (≈ 1.01 MW_th per MW_e), an electrical share ≈ 0.50 at ≈ 0.96 total efficiency. 1/3 is conservative
      for the electricity a degas + CHP option (DR-07 a) credits and generous on its heat. Economics (WP-08)
      must cost and credit the simulated P_el / P_th (not DEA η_e) so the energy and money balances agree.
      The 0.50 sensitivity is TL-15 case CHP-EL-FRAC=0.5 (UQ-CASES; every degassing concept has a CHP).
    source: GEMINI chp.py ELECTRICAL_POWER_FRACTION; RC-10 Sourced values (DEA ch. 06 gas engines)
    sensitivity: [0.3333, 0.50]
    tag: A
    status: default
    added_by: WP-03

  - id: SIM-OUTAGE
    title: Default placement of the DB-30 planned doublet outages (WP-07 calendar)
    value:
      placement: greedy lowest-load non-overlapping windows, one per doublet
      load: "daily heating demand + cooling demand / GM-04 design COP (absorption concepts only)"
      window_wrap: false
      ties: earliest window
      optimiser_parameter: outage_start_indices
    unit: null
    justification: >-
      DB-30 leaves the outage schedule to the optimiser. Until WP-11 chooses it, each doublet's 35-day outage
      is put where the geothermal-side load is lowest (least backup needed), the first doublet in the year's
      lowest window and each next one in the lowest window not overlapping those chosen (DB-30: never
      overlapping). Same window rule as TL-02 (no wrap, earliest on ties). With absorption the drive heat is
      geothermal load, so cooling counts at the GM-04 model COP (not DEM-COP-HD).
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-30, §8 SIM-02 [A interpretation]
    sensitivity: "Any non-overlapping schedule via outage_start_indices (WP-11 optimiser)."
    tag: A
    status: default
    added_by: WP-07

  - id: SIM-DB30B
    title: Days simulated under DB-30 interpretation B
    value:
      simulated_days: "year minus its lowest heating + cooling demand window of (365 − demand_met_days_per_yr) days"
      outages: none
    unit: null
