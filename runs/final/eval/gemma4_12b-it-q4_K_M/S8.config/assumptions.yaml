  - id: SIM-FAST
    title: Fast and full annual simulation modes (SIM-04)
    value:
      fast_wells: TL-06 doublet performance map, linear between 10 m3/h grid points
      fast_surface: TL-09 design PlantSpec components evaluated once each in the CFG-LAYOUT order
      full: the fast daily plan run in GEMINI with TL-11 simulate_plant_day (TL-05 points, controls on)
      comparison: PD-06 metric, warning above 0.02, fail above 0.05
    unit: null
    justification: >-
      SIM-04 asks for a performance-map fast mode and a GEMINI-every-day full mode. The wells (TL-05 root
      solve, the expensive part) come from the TL-06 map; the surface plant uses the same GEMINI component
      models and parameters as the full project so both modes differ only by map interpolation and solver
      order. The dispatch is decided once (fast) and replayed in full mode, so the comparison measures model
      differences, not different decisions.
    source: GEOAGENT_DESIGN_SPEC §8 SIM-04 [D]
    sensitivity: "Map step 5 / 25 m3/h (TL-06 step_m3h)."
    tag: D
    status: default
    added_by: WP-07

  - id: DSP-FLOW
    title: Daily doublet flow rule (SIM-03 (3))
    value:
      split: equal flow on the available doublets
      switch_off: a doublet is switched off when the equal share would fall below the DB-11 minimum
      target: smallest flow at which plate HEX + CHP + HTHP (≤ nameplate) meet the plant load without the boiler
      maximum: candidate design flow (plate HEX and ESP design point), within the DB-11 range
      resolution_m3h: 0.06
    unit: null
    justification: >-
      The district water passes plate HEX → CHP → HTHP → peak boiler, so the SIM-03 order in which sources
      take the load is the topology and the free decision is the brine flow. The smallest flow that keeps the
      boiler off minimises brine production: pumping, and the associated gas the CHP must burn (DB-36) with
      its CO2. It is knowingly not the lowest operating cost: a larger flow gives more plate-HEX and less
      HTHP heat, which can save electricity (WP-07 physics check: C7 15 Apr 108 → 135 m3/h, −6 % net
      electricity; C2 also more CHP electricity but +3.8 t/d CO2). A cost/CO2-priced flow search is WP-11's.
      Equal sharing minimises pump power because ESP power Q·Δp(Q) grows faster than Q (RC-01). When the
      maximum flow is not enough the boiler fills, then unmet demand is recorded.
    source: GEOAGENT_DESIGN_SPEC §8 SIM-03; RC-01 [A interpretation]
    sensitivity: "Spread over all doublets at the minimum flow; or maximum geothermal flow (WP-11)."
    tag: A
    status: default
    added_by: WP-07

  - id: DSP-HP-MIN
    title: HTHP minimum daily part load before switching the heat pumps off
    value:
      min_part_load_frac: 0.10
      max_extra_flow_frac: 0.10
    unit: "-"
    justification: >-
      RC-04 gives no HTHP turndown. Below min_part_load_frac of the reference heat (hthp_heating_mw, else the
      HTHP heat at the DB-18 peak with all doublets at the design flow) the HTHPs are switched off if HEX + CHP
      carry the load with at most max_extra_flow_frac more total brine (DSP-FLOW re-solved without HTHPs), so
      no large brine or CHP must-run increase is bought against the HEX → HTHP → CHP merit order; otherwise a
      daily average below the minimum is read as on/off cycling within the day and kept (noted). The WP-06
      July trickle at full flow (≈ 150 W, COP 9.8) is removed by DSP-FLOW's minimum flow; this rule removes
      the remaining small trickles with hot brine (e.g. 3 kW at 105 °C wellhead) when the reference is > 0; a
      zero reference (no nameplate and no HTHP heat at the design point) disables the rule (TL-12 warns).
    source: engineering assumption [A]; WP-06 follow-up (PROGRESS)
    sensitivity: "min_part_load_frac 0–0.25; max_extra_flow_frac 0–0.25"
    tag: A
    status: default
    added_by: WP-07

  - id: DSP-ABS-MIN
    title: Absorption chiller minimum load (dispatch)
    value: 0.10
    unit: "-"
    justification: >-
      COOL-ABS-PL: Method B COP falls to ≈ 0.47 at 10 % load and 0.21 at 2 % (85 °C drive); WP-02 asks dispatch
      to avoid very low absorption loads. Below 10 % of the absorption nameplate the residual after free
      cooling goes to the electric chiller. Above it the drive brine is the smallest given flow (≥ the
      COOL-ABS-DRV minimum + 1 % TL-05 flow tolerance, drive ΔT ≤ DB-12) at which GM-04 meets the residual
      capped at its capacity at the maximum doublet flow — SIM-03 (1) puts absorption up to its GM-04
      capacity before the electric chiller. Consequence (WP-07 physics check): a small, capacity-limited
      machine chases its last few % with a large drive flow (C3 with 3 MW: one doublet at ≈ 290 m3/h in
      late July for ≈ 0.2–0.8 MW more absorption cooling, + CHP gas), against DSP-FLOW's minimise-brine
      reasoning; a cost/CO2-based absorption vs electric split is WP-11's.
    source: COOL-ABS-PL (WP-02) [A]
    sensitivity: [0.05, 0.25]
    tag: A
    status: default
    added_by: WP-07

  - id: DSP-STORAGE
    title: C6 seasonal HT-ATES dispatch ledger
    value:
      sizes: "equipment_sizes storage_capacity_mwh and storage_power_mw (both required, no default)"
      charge: spare geothermal capacity (all available doublets at the design flow, the day's absorption drive, no boiler) on days without boiler heat; served by the plant as extra load
      discharge: in series ahead of the peak boiler at full district flow, displacing boiler heat, fuel and CO2 one for one
      recovery: STO-REC-HT (on discharge)
      cycles: 2 (second pass starts from the first's end state)
      outlet_temperature: not modelled (discharge assumed at the supply temperature)
    unit: null
    justification: >-
      C6 has no GEMINI storage component (WP-06). WP-03's ThermalStorage keeps the ledger: the plant serves
      demand + charge on charge days; on discharge days the plant is unchanged and the storage preheats the
      water ahead of the boiler, so HEX/HTHP heat is not lost to a smaller district flow (WP-07 physics
      check). DayResult heat_by_source_mw['storage'] holds the net heat (negative while charging), as
      ThermalStorage.net_heat_to_plant_w prescribes. No storage power default: capacity / 24 h gave 125 MW
      for 3000 MWh, implausible for seasonal ATES. RC-09: seasonal ATES needs an annual heat balance —
      charged/discharged totals are reported and an end ≠ start above 1 % of capacity is warned.
    source: RC-09 Thermal storage; WP-03 GM-09 [A interpretation]
    sensitivity: "Recovery 0.63 → 0.8; storage power ± 50 %."
    tag: A
    status: default
    added_by: WP-07

  - id: OPT-SPACE
    title: Optimisation variables, integer options and bounds (TL-13)
    value:
      doublet_options: [1, 2, 3]
      depth_options_m: [1500.0, 2000.0, 2500.0, 3000.0, 3200.0, 3500.0]
      design_flow_m3h: "DB-11 range (limits.yaml flow_min_active_m3h … flow_max_m3h)"
      peak_boiler_mw: "not searched: largest daily boiler heat of the design, rounded up to size_resolution_mw (cap-only unit)"
      electric_chiller_mw: "not searched: larger of the largest daily electric-chiller duty and its duty on the DB-19 peak day at the DB-34b design ambient (the chiller sizing point), rounded up, at least min_equipment_mw (cap-only unit)"
      absorption_chiller_mw: "min_equipment_mw … DB-19 cooling peak (C3, C4; the absorption/electric split)"
      hthp_heating_mw: "min_equipment_mw … HTHP heat at the design point with every doublet at the DB-11 maximum flow (C2, C3, C5)"
      min_equipment_mw: 0.5
      outage_start_indices: "DB-30 A only, second DE stage at the size optimum: one integer per doublet; sorted u_i ∈ [0, 365 − n·35], start_i = u_(i) + i·35 (never overlapping); seeded with SIM-OUTAGE"
      flow_resolution_m3h: 1.0
      size_resolution_mw: 0.05
      dispatch_levers:
        DSP-HP-MIN.min_part_load_frac: [0.0, 0.25]
        DSP-HP-MIN.max_extra_flow_frac: [0.0, 0.25]
        DSP-ABS-MIN: [0.05, 0.25]
      derived_not_searched: "plate-HEX UA (CFG-HEX: sized at the design flow for DB-12/DB-16), CHP (burns all associated gas, DB-36; priced at its largest daily heat), free-cooling HEX (largest daily duty) and its tower beyond the chiller plant's (largest daily rejection), storage (C6, unpriced)"
    unit: null
    justification: >-
      Spec §9.1 OPT-01/OPT-03: integers (doublets 1–3, depths 1.5/2.0/2.5/3.0/3.2/3.5 km) are enumerated; the
      continuous sizes are refined by seeded differential evolution. Every integer combination is first
      screened at the CFG-SIZING sizes (DB-18/DB-19 peaks, HTHP without a nameplate) and the DB-11 maximum
      flow; only the best `top_k` combinations are refined (OPT-DE). The peak boiler and the electric chiller
      only cap their output in the WP-07 dispatch (constant boiler efficiency; the chiller COP does not depend
      on its load ratio), so with the CFG-SIZING peaks (never binding) their cost-optimal nameplate given the
      other choices is the largest daily output: an exact inner optimum that keeps them out of the search; the
      optimum is re-run with these nameplates to confirm zero unmet demand. Day-average sizing, like the whole
      model (DB-18/DB-19 are day-average peaks); no N-1 redundancy is required by the hard limits. An HTHP
      nameplate above its design-point heat (all doublets at the DB-11 maximum, DB-18 peak, brine floor DB-12
      and VER-HP-LIFT) is never used. The
      GEMINI chiller and heat-pump models need a positive nominal capacity, hence min_equipment_mw (0.5 MW
      = 142 tons, above the RC-05 cost functions' 100-ton floor); a concept without the unit is the other
      concept (C1 = C2 without HTHP). Outage starts use the sorted-gap transform so every DE vector is a
      DB-30-valid, non-overlapping schedule. Sizes are rounded to the stated resolution (DSP-FLOW resolves
      0.06 m³/h) so repeated vectors are evaluated once. C6 storage sizes are not optimised: RC-10 has no
      HT-ATES cost (they are scanned unpriced). Return temperature (OPT-01 MAY) is a TL-15 case (DB-31).
      The remaining OPT-01 variables are derived, not searched (derived_not_searched): the plate-HEX UA follows
      the design flow (CFG-HEX), the CHP burns all associated gas (DB-36), the free-cooling HEX and its extra
      tower follow their largest daily duty. DSP-* levers are priced at the bounds of their own sensitivity
      fields (dispatch_levers) on the optimum and reported; the register values are not changed. A year whose
      WP-07 margins breach DB-11, DB-12 or DB-14 is rejected like a guard violation (golden rule 4); a DB-16/
      DB-17 supply margin below zero is the temperature view of a capacity shortfall that WP-07 counts as
      unmet demand (penalised by OPT-OBJ, never selected), and is rejected only without unmet demand.
    source: GEOAGENT_DESIGN_SPEC §9.1 OPT-01, OPT-03; DB-10, DB-11, DB-18, DB-19, DB-30; CFG-SIZING; RC-05 (100-ton floor) [A]
    sensitivity: "top_k and the DE budget (OPT-DE) trade runtime against the size refinement."
    tag: A
    status: default
    added_by: WP-11

  - id: OPT-OBJ
    title: Optimisation objective, unmet-demand penalty and hard-limit barrier (TL-13)
    value:
      objective: "LCOH + LCOC over the base analysis period (ECO-01, 30 yr), USD/MWh"
      unmet_penalty_base_per_mwh: 1000.0
      unmet_penalty_per_unmet_mwh: 1.0
      rejected_objective: 1000000.0
      pareto_points: 3
    unit: USD/MWh
    justification: >-
      Spec §9.1 OPT-02: minimise LCOH + LCOC subject to zero unmet demand and the hard limits. Unmet demand
      > 0 adds 1000 USD/MWh plus 1 USD/MWh per MWh unmet: the base exceeds any LCOH + LCOC of a design that
      meets demand (C0 LCOH ≈ 137 USD/MWh ≈ the ACM cap, ECO-07), so such a design always ranks first, and
      the slope steers the search towards feasibility. A design that DesignGuard rejects (golden rule 4) or
      that the generator/dispatch cannot build is never simulated or priced: it gets the barrier value
      1e6, is recorded with the guard's reason and can never be selected (only evaluations with status ok
      and zero unmet demand are reported as optimal). CO₂ Pareto: up to 3 non-dominated points (lowest
      cost, lowest CO₂, closest to the normalised utopia point) among the evaluated designs that meet demand.
    source: GEOAGENT_DESIGN_SPEC §9.1 OPT-02; ECO-07 benchmarks [A]
    sensitivity: "Any base above the largest feasible LCOH + LCOC gives the same optimum."
    tag: A
    status: default
    added_by: WP-11

  - id: OPT-DE
    title: Differential-evolution settings (seeded, reproducible)
    value:
      seed: 2026
      strategy: best1bin
      popsize: 5
      maxiter: 8
      maxiter_outage: 6
      mutation: [0.5, 1.0]
      recombination: 0.7
      tol: 0.01
      init: latinhypercube
      polish: false
      updating: deferred
      top_k: 2
    unit: null
    justification: >-
      scipy.optimize.differential_evolution with a fixed seed and deferred updating, so the same seed gives
      identical results whether the population is evaluated serially or by a process pool (OPT-03); each
      stage's population is seeded (x0) with the screened design / the SIM-OUTAGE schedule. One fast-mode
      year takes ≈ 2 s at 2.5 km but 7–25 s at ≥ 3 km (brine ≥ 100 °C: nested HEX-share/HTHP bisections in
      WP-07), so popsize 5 × (number of variables) with 8 size and 6 outage generations keep the C2 run within
      the 15-min budget on 4 vCPU (WP-11 acceptance); polish is off (L-BFGS-B on a penalised, rounded
      objective wastes evaluations). Unit tests use a smaller budget.
    source: GEOAGENT_DESIGN_SPEC §9.1 OPT-03; scipy differential_evolution docs [A]
    sensitivity: "More generations refine sizes by a few tenths of a USD/MWh at proportionally more runtime."
    tag: A
    status: default
    added_by: WP-11

  - id: UQ-RANGES
    title: Uncertainty inputs for the Monte Carlo and one-at-a-time sensitivity (TL-15)
    value:
      permeability_md: {distribution: lognormal, low: 100.0, high: 400.0, note: "P90–P10 (10th/90th percentiles); median 200 = DB-06", source: "spec §9.3 UQ-01; DB-06"}
      geothermal_gradient_k_per_km: {distribution: uniform, low: 28.0, high: 32.0, source: "spec §9.3 UQ-01; DB-03"}
      skin: {distribution: uniform, low: -1.0, high: 5.0, source: "DB-38 sensitivity; spec §9.3 UQ-01"}
      heating_demand_scale: {distribution: uniform, low: 0.9, high: 1.1, source: "spec §9.3 UQ-01 demand ±10 %"}
      cooling_demand_scale: {distribution: uniform, low: 0.9, high: 1.1, source: "spec §9.3 UQ-01 demand ±10 %"}
      heating_return_degc: {distribution: uniform, low: 45.0, high: 65.0, note: "operating return of the built plant (capex fixed); the UQ-CASES DB-31 values are design alternatives (capex re-derived)", source: "spec §9.3 UQ-01; DB-31"}
      warm_climate_frac: {distribution: uniform, low: 0.0, high: 1.0, note: "[A] fraction of the DB-34b warm-case offset (+5 K dry bulb, +2.6 K wet bulb) added to cooling-season days (cooling demand > 0); one-sided: the base is its P0, not its P50", source: "DB-34b warm case; spec §9.3 UQ-01"}
      production_temperature_shift_k: {distribution: uniform, low: -6.0, high: 6.0, note: "[A] interpretation: RC-02's Boolean-lens extreme on the 30-yr production temperature (smoother case ±2 °C) applied from year 1 as gradient ± shift/depth (also moves p_b and the DPDT profile)", source: "RC-02 item 3 (±6 °C on 30-yr production temperature); spec UQ-01"}
      hp_carnot_fraction: {distribution: uniform, low: 0.50, high: 0.65, source: "VER-HP-ETA sensitivity (RC-04)"}
      hp_approach_k: {distribution: uniform, low: 3.0, high: 5.0, source: "HP-APPROACH sensitivity (RC-04 eq 4)"}
      absorption_duhring_slope: {distribution: uniform, low: 1.1, high: 1.2, source: "COOL-ABS-B (RC-05 Method B)"}
      electric_chiller_carnot_efficiency: {distribution: uniform, low: 0.44, high: 0.513, source: "COOL-ELC (RC-06)"}
      esp_intake_margin_factor: {distribution: uniform, low: 1.1, high: 1.3, note: "SUB-PBUB margin = VER-ESP-MARGIN (moved together, TL-05 enforces it); VER-ESP-PB is only the DesignVerifier's fallback (inert in TL-13/15) and is scaled 60 × margin/1.2 so the base is unchanged", source: "SUB-PBUB sensitivity; VER-ESP-MARGIN"}
      injection_pump_suction_barg: {distribution: uniform, low: 0.0, high: 3.0, source: "SUB-PSUC sensitivity"}
      injectivity_factor: {distribution: uniform, low: 0.65, high: 1.0, note: "[A] II = factor × PI. No card value: 0.8 reproduces LIM-SUB-02's +6 bar on the 26.5 bar(g) injection WHP at 300 m³/h; a near-well cold zone with water viscosity 1.5–1.65 × that at reservoir temperature (55–65 °C injectate) gives ≈ 0.63–0.72, hence 0.65 as the low bound", source: "SUB-II; LIM-SUB-02 (cold injection); WP-11 physics check"}
      well_spacing_m: {distribution: uniform, low: 1000.0, high: 1500.0, source: "SUB-SPACING sensitivity (RC-02)"}
      cost_items: {distribution: uniform, low: "item sensitivity_low", high: "item sensitivity_high", source: "DB-35 / ECO-04: ±30 % or the stated range, whichever is wider (CostBook)"}
    unit: null
    justification: >-
      Spec §9.3 UQ-01 lists the Monte Carlo inputs; each range is taken from the register entry, card or
      spec item that owns the value (source); entries marked [A] in their note are our interpretation or
      derivation and say so. Where the spec and the register differ the register wins (HTHP performance:
      VER-HP-ETA 0.50–0.65 instead of ±15 %; absorption: COOL-ABS-B 1.1–1.2). Not varied: SUB-RHOC (RC-02
      gives no range; t_b is linear in it), SUB-WELL and SUB-ESP (no numeric range on the card; ESP
      stage/scale changes move the frequency, not the rule-based power), SUB-NPSH (a check margin, not a
      performance input), SUB-PWH (the 50 bar(g) value is the C7 pressurised concept, not an uncertainty),
      HP-ETA-L (inert: the VER-HP-ETA cap binds, WP-06). Limitation: TL-09 re-plans the design point of each
      scenario (plate-HEX UA, HTHP brine floor) for its own brine and return temperatures, so a fixed design
      meets a matched HEX in −6 K or low-gradient samples (slightly optimistic); installed costs stay the
      base design's. Samples are Latin-hypercube (seeded), mapped through each
      distribution's inverse CDF; one-at-a-time cases take the low and high values.
    source: GEOAGENT_DESIGN_SPEC §9.3 UQ-01; register entries named per input; RC-02, RC-04, RC-05, RC-06
    sensitivity: "Ranges change with the owning entries; UQ-CASES holds the discrete cases."
    tag: A
    status: default
    added_by: WP-11

