# Assumptions register (CLAUDE.md golden rule 2). Every [A] value or interpretation a tool uses MUST be here.
# Seeded by WP-00 from GEOAGENT_DESIGN_SPEC §2.3 (DB-34) and §2.4 (DB-30…DB-40). Note: the spec defines no DB-39.
# Later WPs append entries (never rename/remove); set added_by to the WP id and note them in PROGRESS.md.
# Fields: id, title, value, unit, justification, source, sensitivity, tag (P/D/L/W/A), status, added_by.
# Schema: gemini_agent.schemas.config.AssumptionsRegister.
schema_version: 1
assumptions:
  - id: DB-30
    title: Meaning of "330 daily steps" (doublet availability)
    value:
      interpretation: A
      doublet_available_days_per_yr: 330
      planned_outage_days_per_doublet: 35
      outages_may_overlap: false
      outage_schedule: chosen by the optimiser
      demand_met_days_per_yr: 365
    unit: null
    justification: >-
      Availability interpretation: each doublet is available 330 of 365 days (35-day planned outage,
      never overlapping); heating and cooling demand must be met on all 365 days. 330/365 = 90.4 %
      matches the standard 90 % availability planning assumption; it is the conservative reading
      (forces backup capacity) and a design that passes it also passes the "simulate only 330 days" reading.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-30; ESMAP p.31 [L]
    sensitivity: "Interpretation B: simulate 330 days with no outage; report both."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-31
    title: District-heating return temperature
    value: 55.0
    unit: degC
    justification: >-
      100/55 °C network. Between measured Danish returns of 40–43 °C (Danfoss/Thisted p.4–5) and
      conventional geothermal practice of ΔT >= 17–22 K (Guidebook p.231, 234); 55 °C lets the plate
      HEX cool brine ≈ 86 → 58 °C before the heat-pump evaporator takes it to >= 46 °C. The agent MAY
      treat the return temperature as a design lever.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-31; Danfoss/Thisted p.4–5 [L]; Guidebook p.231, 234 [L]
    sensitivity: [45.0, 65.0, 75.0]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-32
    title: Cooling-network return temperature
    value: 26.0
    unit: degC
    justification: 20/26 °C; direct-cooling grids run ΔT 5–6 K.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-32; Shallow DHC review p.8 [L]
    sensitivity: [24.0, 28.0]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-33
    title: Brine specific heat capacity
    value: 4100.0
    unit: J/(kg K)
    justification: Saline brine is below fresh water 4.19 kJ/(kg K) (the Guidebook uses fresh-water values).
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-33
    sensitivity: [4000.0, 4190.0]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-34a
    title: Daily ambient temperature series for 2027
    value:
      method: piecewise_linear
      anchor_day_of_month: 15
      wrap_year: true
      data: config/climate_nl.yaml
    unit: null
    justification: >-
      Smooth seasonal profile from KNMI De Bilt 1991–2020 monthly normals placed at mid-month.
    source: GEOAGENT_DESIGN_SPEC §2.3 DB-34a; RC-07; KNMI normals [W]
    sensitivity: "Warm-climate case (DB-34b)."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-34-RH
    title: Monthly relative humidity (for wet-bulb)
    value: [87, 84, 80, 75, 74, 76, 77, 78, 82, 85, 88, 88]
    unit: "%"
    justification: >-
      No KNMI RH normals obtained; assumed values used with the Stull (2011) formula to derive monthly
      wet-bulb. Replace with KNMI normals if obtained.
    source: GEOAGENT_DESIGN_SPEC §2.3; RC-07 [A]
    sensitivity: "Warm-climate design point 30 °C DB / 21 °C WB (DB-34b)."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-34b
    title: Summer design point for chiller and heat-rejection sizing
    value:
      dry_bulb_degc: 25.0
      wet_bulb_degc: 18.4
      warm_case_dry_bulb_degc: 30.0
      warm_case_wet_bulb_degc: 21.0
    unit: degC
    justification: >-
      1 % cooling dry-bulb with mean coincident wet-bulb, Amsterdam WMO 062400 (1973–1996) [W]. The warm
      case (30 °C DB / 21 °C WB) is an assumption [A] because the record pre-dates recent warming.
    source: GEOAGENT_DESIGN_SPEC §2.3 DB-34b; RC-07; NOAA Engineering Weather Data [W]; warm case [A]
    sensitivity: "Warm-climate case 30 °C DB / 21 °C WB."
    tag: W
    status: default
    added_by: WP-00

  - id: DB-34c
    title: Annual mean air and shallow-ground temperature
    value:
      annual_mean_air_degc: 10.5
      shallow_ground_degc: 12.5
    unit: degC
    justification: >-
      Annual mean = mean of the KNMI monthly normals [W] (10.52 °C) [D]; shallow ground ≈ air mean
      + 2 °C [L]; consistent with DB-04 (surface 12 °C).
    source: GEOAGENT_DESIGN_SPEC §2.3 DB-34c; Shallow DHC review p.3 [L]
    sensitivity: null
    tag: D
    status: default
    added_by: WP-00

  - id: DB-34d
    title: Exergy dead state
    value: daily_dry_bulb
    unit: null
    justification: Dead state T0 = daily ambient dry-bulb; stated in every exergy KPI.
    source: GEOAGENT_DESIGN_SPEC §2.3 DB-34d; DiPippo Ch10 p.7 [L]
    sensitivity: null
    tag: L
    status: default
    added_by: WP-00

  - id: DB-35
    title: Cost data policy
    value:
      labelled_sources_only: true
      min_sensitivity_frac: 0.30
    unit: null
    justification: >-
      Only labelled sources (spec §9.2). The former '[A] placeholder' items now carry the RC-10 "Sourced
      values"; sensitivity is ±30 % or the item's stated range, whichever is wider (ECO-04).
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-35, §9.2 ECO-04; RC-10; config/cost_assumptions.yaml
    sensitivity: "±30 % or the stated range, whichever is wider."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-36
    title: Associated-gas handling
    value:
      decision_variable: true
      options: [degas_use, pressurised_reinject]
      venting_allowed: false
    unit: null
    justification: >-
      Decision variable, not an assumption (DR-07): (a) degas and use the gas in CHP/boiler with
      calcite inhibitor, or (b) keep the loop pressurised and reinject dissolved gas. Venting CH4 is
      never allowed. Degassing CO2 raises calcite scaling risk; Pleasant Bayou precedent for burning
      separated methane.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-36; DiPippo §4.4, §9.6.3 [L]; WEC p.15 [L]; Guidebook p.160 [L]
    sensitivity: "Both variants simulated."
    tag: A
    status: default
    added_by: WP-00

  - id: DB-37
    title: Grid electricity CO2 intensity
    value: 0.3
    unit: kg/kWh
    justification: Value used in the GEMINI example.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-37; GEMINI example
    sensitivity: [0.2, 0.4]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-38
    title: Skin, wellbore radius, drainage radius
    value:
      skin: 0.0
      wellbore_radius_m: 0.108
      drainage_radius_m: 1000.0
    unit: null
    justification: Skin 0; rw = 0.108 m (8½-inch hole); re = 1,000 m.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-38
    sensitivity:
      skin: [-1.0, 5.0]
    tag: A
    status: default
    added_by: WP-00

  - id: DB-40
    title: Meaning of the 70 % pump efficiency
    value:
      pump_hydraulic_efficiency_frac: 0.70
      motor_efficiency_frac: 0.93
      vfd_efficiency_frac: 0.97
    unit: null
    justification: >-
      70 % is the pump hydraulic (shaft) efficiency; motor and VFD losses are added separately
      (motor 93 %, VFD 97 % [A]). Guidebook examples use 60–65 % wire-to-water.
    source: GEOAGENT_DESIGN_SPEC §2.4 DB-40; Guidebook p.256–263 [L]
    sensitivity: "Wire-to-water 70 %."
    tag: A
    status: default
    added_by: WP-00

  - id: ECO-CUR
    title: Reporting currency for costs
    value: USD
    unit: null
    justification: >-
      The cost basis (currency, discount rate, energy prices) is an open question for the organisers
      (spec §17 Q5). RC-10 reports every sourced value in USD as well as natively. Values are stored
      natively (EUR, USD, AUD with price year) and converted in code with eur_to_usd = 1.13 (ECB 2025
      annual average), aud_to_usd = 0.63, the DEA 2020→2025 EUR factor 1.168 and CEPCI where marked.
      The price-year mismatch between sources (2002/2011/2020/2023/2025 EUR and USD; NREL dollar-year
      not stated) is accepted as ± a few % (RC-10).
    source: RC-10 (incl. Sourced values); GEOAGENT_DESIGN_SPEC §17 Q5 (open)
    sensitivity: "eur_to_usd 1.08–1.13; revisit when the organisers answer §17 Q5."
    tag: A
    status: default
    added_by: WP-00

  - id: SUB-RHOC
    title: Aquifer volumetric heat capacity (thermal-breakthrough screening)
    value: 2500000.0
    unit: J/(m3 K)
    justification: >-
      Gringarten–Sauty (1975) breakthrough time t_b = π h D² (ρC)_a / (3 (ρC)_w Q) needs the
      volumetric heat capacity of the saturated aquifer; RC-02 gives ≈ 2.5e6 J/(m³ K) [A]. With
      h = 100 m and Q = 300 m³/h it reproduces DB-26 (23.6 yr at D = 1.0 km, 34 yr at 1.2 km).
    source: RC-02 eq 1 [A]; GEOAGENT_DESIGN_SPEC §2.2 DB-26
    sensitivity: >-
      No range on RC-02; t_b is linear in (ρC)_a, so a ±x % change moves t_b by ±x % (WP-11 UQ-RANGES: not varied, no range on the card).
    tag: A
    status: default
    added_by: WP-04

  - id: DEM-COP-HD
    title: Screening COP of heat-driven cooling (demand profiling only)
    value: 0.75
    unit: "-"
    justification: >-
      Used only by the demand tool to build the screening profile "heating + cooling / COP" (the heat a
      geothermal plant would supply if all cooling were heat-driven). Spec §3.2 states this screening
      value (window 6 May–9 Jun, ≈ 143 GWh/yr). Sizing and simulation use the calibrated RC-05
      absorption-chiller model, which gives COP ≈ 0.60–0.70 for 85–105 °C drive heat.
    source: GEOAGENT_DESIGN_SPEC §3.2 [A]; RC-05 (COP 0.60–0.70) [L]
    sensitivity: [0.60, 0.70]
    tag: A
    status: default
    added_by: WP-04

  - id: SUB-II
    title: Injectivity index of the injector
    value: equal_to_pi
    unit: null
    justification: >-
      The injector's injectivity index II is taken equal to the producer's PI (same reservoir, same
      completion), so injection bottom-hole pressure is P_res + Q/II (RC-01 item 4, DiPippo eq
      4.14–4.15). Used by TL-01 to show that an injection pump is needed (DB-21).
    source: RC-01 item 4 [A]
    sensitivity: "Cold-water injection usually lowers II (viscosity); WP-05 may add a factor."
    tag: A
    status: default
    added_by: WP-04

  - id: SUB-WELL
    title: Well completion used for doublet hydraulics (TL-05, TL-06)
    value:
      trajectory: vertical
      inner_diameter_m: 0.216
      roughness_m: 0.0000457
    unit: null
    justification: >-
      Producer and injector are vertical to the reservoir mid-depth. One flow-path inner diameter is used
      for the whole well: the 8½-inch hole of DB-38 (2 × r_w = 0.216 m). This is conservative for friction,
      because the pump chamber is ≥ 13⅜-inch casing (RC-01 item 11). Wall roughness is that of steel pipe,
      0.0457 mm (RC-01 eq 5); it is always passed explicitly as roughness_m, never GEMINI's 0.01 m default
      (WP-01 follow-up). Wellbore heat loss uses GEMINI DPDT's hard-coded U = 10 W/(m² K) against the
      undisturbed geothermal gradient (RC-01 eq 1 and envelope note); this steady value is
      conservative (start-up) at part load, e.g. ≈ 10 K loss at 50 m³/h.
    source: RC-01 items 1, 5, 11; GEOAGENT_DESIGN_SPEC §2.4 DB-38
    sensitivity: >-
      A larger flow diameter (13⅜-inch casing above the pump) lowers friction; scaling or corrosion raises
      roughness. Producer friction is ≈ 4.5 bar at 300 m³/h with the base values.
    tag: A
    status: default
    added_by: WP-05

  - id: SUB-PWH
    title: Producer wellhead pressure (TL-05 operating point)
    value: 3.0
    unit: bar(g)
    justification: >-
      GEMINI's own doublet example (simulator_examples/projects/doublet_plant.json) produces against a
      3.0 bar wellhead pressure, and the C2/C3 reference process degasses at the surface (spec §3.5). With
      this value TL-05 reproduces the RC-01 envelope (ESP Δp 30–40 bar, ≈ 0.4 MW shaft at 300 m³/h). A
      pressurised loop without degassing (C7, DB-36) must keep the wellhead above the bubble point
      (SUB-PBUB, ≈ 45 bar(g) at 87 °C; RC-01 item 9, RC-12) and passes its own value to TL-05; that exceeds
      the plate-HEX ratings on RC-03. Pressures are gauge throughout.
    source: GEMINI doublet_plant.json boundary input; GEOAGENT_DESIGN_SPEC §3.5; RC-01 envelope; RC-12
    sensitivity: [3.0, 50.0]
    tag: A
    status: default
    added_by: WP-05

  - id: SUB-PBUB
    title: Brine bubble-point pressure (Henry's law) and ESP-intake setpoint (VER-ESP-PB)
    value:
      method: henry_law
      basis: sea_water
      second_bound: pure_water
      intake_margin_factor: 1.2
      bubble_pressure_bara: 46.1
      bubble_pressure_pure_water_bara: 52.2
      at_temperature_degc: 87.0
      intake_setpoint_bara: 55.3
    unit: null
    justification: >-
      The design basis gives no bubble point, so it is computed with Henry's law exactly as RC-01 item 9
      specifies: p_b = Σ c_i / H_i(T), c_i = GLR · y_i / 0.022414 mol/m³ (DB-09: 0.8 Nm³/m³, 80 % CH₄,
      20 % CO₂), H_i(T) = H_i° · exp[B_i (1/T − 1/298.15)] with the card's sea-water constants (CH₄ 1.2e-5
      mol m⁻³ Pa⁻¹, B 1100 K; CO₂ 2.8e-4, B 2600 K) as the basis for our 1030 kg/m³ brine and the
      pure-water constants (CH₄ 1.4e-5, 1600 K; CO₂ 3.4e-4, 2300 K) as the second bound. Ideal gas, no
      fugacity or water-vapour correction (card). TL-05 evaluates it at the reservoir temperature of each
      design (CH₄ p_b rises with T over 25–100 °C, so this is the conservative end); the values above are
      the record at DB-01 (87 °C): p_b 46.1 bar(a) sea water (CH₄ 44.9 + CO₂ 1.1 bar), 52.2 bar(a) pure
      water. The ESP intake must stay at or above 1.2 · p_b (margin for the van 't Hoff extrapolation
      298 → 360 K and salinity above sea water [A]) = 55.3 bar(a) = 54.3 bar(g); the card rounds this up
      to 60 bar(a) only as a default when p_b is not computed. The bare p_b (bar(g), not multiplied) is
      passed to the verifier as the release pressure (EspPoint.release_pressure_barg); the DesignVerifier
      applies the same factor itself from VER-ESP-MARGIN, so the two entries must state the same margin
      (a test checks it). Replaces the former 20 bar(g) default, which the card now calls not
      conservative.
    source: >-
      RC-01 item 9 (Henry's-law constants: Sander, Compilation of Henry's law constants v5.0.0, Atmos.
      Chem. Phys. 23, 10901–12440, 2023; Burkholder et al. 2019, JPL Publication 19-5) [L]; margin 1.2 [A]
    sensitivity: >-
      Pure-water bound 52.2 bar(a) (setpoint 62.6 bar(a)); margin 1.1–1.3. The ESP setting depth moves
      ≈ 10 m per bar of setpoint; a measured bubble point replaces the estimate.
    tag: L
    status: default
    added_by: WP-05

  - id: SUB-NPSH
    title: ESP net positive suction head check
    value:
      npsh_margin_m: 15.0
      vapour_pressure_bound_bara: 1.01325
      vapour_pressure_bound_valid_to_degc: 100.0
      atmospheric_pressure_bara: 1.01325
    unit: null
    justification: >-
      NPSHA = (P_intake + P_atm − P_vap) / (ρ g), in m of brine (Guidebook p.173, RC-01 item 8). The
      pump's NPSHR is not given (missing input), so the check is NPSHA ≥ 15 m, the heuristic margin of
      RC-01 item 8 (DiPippo Problem 4.5); add NPSHR when a pump is selected. The vapour pressure is bounded
      by water at its normal boiling point (1.01325 bar(a) at 100 °C), which is conservative for brine at
      or below 100 °C (dissolved salt lowers it). Above 100 °C NPSHA is not evaluated (warning). The
      bubble-point setpoint SUB-PBUB (1.2 · p_b) is far more restrictive at the intake.
    source: RC-01 item 8 [L Guidebook p.173; DiPippo Problem 4.5]; [A]
    sensitivity: "NPSHR of the selected pump (typically a few metres) adds to the 15 m margin."
    tag: A
    status: default
    added_by: WP-05

  - id: SUB-ESP
    title: ESP model and sizing rules (TL-05, TL-06)
    value:
      stage_head_coeff: [83.08389282, -0.000460444, -1.19e-07, 1.69e-11, -6.36e-16, 6.69e-21]
      stage_power_coeff: [10.02089977, -0.000160233, 6.52e-08, -2.13e-12, 1.71e-17, 1.38e-23]
      frequency_min_hz: 30.0
      frequency_max_hz: 70.0
      frequency_nominal_hz: 60.0
      setting_depth_step_m: 10.0
      flow_scale_rule: best_efficiency_point_at_max_flow
      stages_rule: max_flow_at_nominal_frequency
      setting_depth_rule: shallowest_with_intake_at_bubble_pressure_at_max_flow
    unit: null
    justification: >-
      Stage curves are GEMINI's ESP polynomials (TNO 2022 R11363; pump HC27000 in GEMINI's tests and the
      doublet example; head in ft and brake power in hp per stage against bbl/d at 60 Hz). Their best-
      efficiency point is ≈ 183 m³/h (72 %) and the head is negative above ≈ 280 m³/h, so DB-11's
      300 m³/h needs a larger pump of the same family: the curve is flow-scaled (Q × k, head per stage × 1,
      power × k, efficiency unchanged; like k impellers in parallel) so that its best-efficiency point is at
      the maximum design flow. The number of stages is the smallest that gives the required ESP Δp at the
      maximum flow at the nominal 60 Hz (60–70 Hz is kept for decline). The setting depth is the shallowest
      depth, in 10 m steps, where the intake stays at or above the SUB-PBUB setpoint (1.2 · p_b) at the
      maximum flow. Frequency window
      30–70 Hz (RC-01 item 7); below 30 Hz the flow is held at 30 Hz with a wellhead choke. GEMINI scales
      head by (f/60)² and power by (f/60)³ at the same flow (no flow affinity), so its curve power is
      optimistic at reduced frequency; plant power uses the DB-13/DB-40 rule QΔp/0.70 and the curve power
      is reported for comparison only.
    source: RC-01 items 7, 11; GEMINI gemini_model/pump/esp.py and simulator_examples/projects/doublet_plant.json
    sensitivity: "Stage count ± 1 and flow scale ± 10 % (change the frequency, not the rule-based power)."
    tag: A
    status: default
    added_by: WP-05

  - id: SUB-PSUC
    title: Injection-pump suction pressure
    value: 0.0
    unit: bar(g)
    justification: >-
      The surface-loop pressure that reaches the injection pump is not known until WP-06 builds the plant.
      Conservatively the injection pump supplies the whole injector wellhead pressure: no credit is taken
      for the producer wellhead pressure (SUB-PWH), which the separator, filters and heat exchangers
      consume. This reproduces the RC-01 envelope (≈ 0.3 MW shaft per doublet at 300 m³/h).
    source: "[A]; RC-01 envelope"
    sensitivity: [0.0, 3.0]
    tag: A
    status: default
    added_by: WP-05

  - id: SUB-SPACING
    title: Producer–injector spacing at reservoir depth
    value: 1200.0
    unit: m
    justification: >-
      RC-02 default D ≥ 1200 m (target breakthrough time ≥ 30 yr; ENG-06). Paris/Dogger doublets use
      1–1.3 km, Landau ≈ 1.2 km (RC-02). TL-07 also reports the minimum spacing for t_b ≥ the analysis
      period.
    source: RC-02 Defaults; GEOAGENT_DESIGN_SPEC §3.6 ENG-06
    sensitivity: [1000.0, 1500.0]
    tag: A
    status: default
    added_by: WP-05

  - id: VER-ESP-PB
    title: ESP-intake / CO₂-release pressure setpoint (bubble point from Henry's law)
    value: 60.0
    unit: bar(a)
    justification: >-
      The design basis gives no bubble point, so RC-01 item 9 computes it with Henry's law
      (p_b = Σ c_i / H_i(T), sea-water constants, 87 °C, GLR 0.8 Nm³/m³, 80 % CH₄ / 20 % CO₂):
      p_b ≈ 46 bar(a) on the sea-water basis (52 bar(a) pure water); the card's setpoint is 1.2 · p_b
      ≈ 55 bar(a), rounded up to 60 bar(a). This register default is that computed setpoint. The
      DesignVerifier uses it, converted to gauge (60 − 1.01325 = 58.99 bar(g)), as the minimum ESP
      intake pressure (PH-18) and, for a pressurised loop without degassing (DB-36 option b), as the
      minimum brine pressure at every brine HEX (PD-10, RC-12); with it a gasketed (≈ 20 bar) or welded
      (300 psig) plate HEX cannot hold the loop above release (RC-03). When WP-05's tool computes p_b
      for the actual depth, temperature and gas, it passes the bare bubble point in bar(g)
      (EspPoint.release_pressure_barg / VerificationEvidence.co2_release_pressure_barg); the verifier
      then applies VER-ESP-MARGIN itself and this default is not used. This value already contains
      the 1.2 factor and is not recomputed from VER-ESP-MARGIN: change both together in sensitivity
      runs.
    source: RC-01 item 9 (Henry's law, Sander 2023 constants), margin 1.2 [A]
    sensitivity: "p_b 46 (sea water) / 52 (pure water) bar(a); margin 1.0–1.3 ⇒ setpoint ≈ 46–68 bar(a): the ESP setting depth moves accordingly."
    tag: A
    status: default
    added_by: WP-09

  - id: VER-ESP-MARGIN
    title: Safety factor on the computed bubble point for the ESP-intake / brine-pressure setpoint
    value: 1.2
    unit: "-"
    justification: >-
      RC-01 item 9 sets p_intake ≥ 1.2 · p_b with p_b in bar(a); the factor covers the van 't Hoff
      extrapolation of the Henry's-law constants (298 → 360 K; CH₄ solubility has its minimum near
      80–100 °C) and salinity above sea water. When a tool passes the bare bubble point p_b (bar(g):
      EspPoint.release_pressure_barg or VerificationEvidence.co2_release_pressure_barg), the
      DesignVerifier applies this factor itself: limit_barg = 1.2 · (p_b_barg + 1.01325) − 1.01325,
      for the ESP intake (PH-18) and the pressurised-loop brine pressure (PD-10). For PD-10 this is a
      conservative reading: RC-01 item 9 only requires the surface loop to stay above p_b, but the
      same Henry's-law uncertainty applies there, and it matches the default path. The no-p_b default
      VER-ESP-PB (60 bar(a)) already includes the factor and does not follow this entry at run time:
      a sensitivity run on the margin must change VER-ESP-PB with it (≈ factor × 46.1 bar(a)).
    source: RC-01 item 9 (margin 1.2 [A])
    sensitivity: [1.0, 1.3]
    tag: A
    status: default
    added_by: WP-09

  - id: VER-HP-ETA
    title: Heat-pump COP cap as a fraction of Carnot when no datasheet is cited
    value: 0.6
    unit: "-"
    justification: >-
      RC-04 flags the 100 °C HTHP datasheet as MISSING and sets a default cap COP ≤ 0.6 × Carnot
      (Carnot from the condensing/evaporating temperatures, RC-04 eq. 1). The DesignVerifier applies
      it (check PH-14) unless the heat-pump operating point carries a datasheet value. gemini_model.heatpump
      reuses it (closed-form path caps COP here; WP-03).
    source: RC-04 parameter table, HTHP at 100 °C supply [A]
    sensitivity: "0.50 / 0.55 / 0.65 (capped design-case COP 3.14 / 3.43 / 4.00; WP-03)"
