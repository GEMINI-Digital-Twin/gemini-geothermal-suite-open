  - id: CFG-LAYOUT
    title: Plant topology generated for each concept (TL-09)
    value:
      brine_train: "producer → [degasser] → filter A → [brine split → absorption drive] → [plate HEX-1] → [brine mix] → [HP evaporator] → filter B → injector"
      district_chain: "return → [bypass] plate HEXs (per doublet, flow shares ∝ doublet flow) → [CHP on associated gas] → [bypass] heat pumps (100 °C target) → [peak boiler, grid gas]"
      controls: "simulate_day cuts the plate-HEX share to hold brine ΔT ≤ DB-12 and ≤ 100 °C before the heat pumps, cuts the heat-pump share only to an hthp_heating_mw nameplate (capacity control), and fires the peak boiler to 100 °C"
      cooling_chain: "[free cooling] → [absorption, residual] → electric chiller (unmet); one cooling tower for all"
      absorption_drive: "brine of the first active doublet through titanium generator tubes, taken before HEX-1"
      derived_concepts: "C6 = parent plant (no storage model in GEMINI); C7 = parent without degasser, WHP = SUB-PBUB setpoint, no CHP; C8 = parent"
    unit: null
    justification: >-
      Spec §3.5 reference process. The CHP is placed before the heat pumps so that the associated gas, which must
      be burned anyway (DB-36, no venting), displaces heat-pump electricity and the heat pumps (fixed 100 °C target)
      self-regulate; the peak boiler is last and is fired by simulate_day only to hold 100 °C. The absorption drive
      uses brine directly through titanium generator tubes (RC-05 p.266–267: Cu/CuNi incompatible) because a clean
      isolation loop is a recycle the forward GEMINI solver cannot run.
    source: GEOAGENT_DESIGN_SPEC §3.4, §3.5; RC-05; RC-07; RC-08 [A]
    sensitivity: "Spec order (HP before CHP trim); isolation HEX + clean loop for the absorption drive (WP-11)."
    tag: A
    status: default
    added_by: WP-06

  - id: CFG-SURFACE
    title: Surface brine train hydraulics and heat losses (TL-09)
    value:
      separator_letdown: "WHP − SUB-PSUC lumped in the degasser at the operating flow"
      filter_and_hex_resistance: 0.0
      surface_temperature_drop_k: 0.0
    unit: null
    justification: >-
      No card gives surface pressure drops or heat losses. The whole wellhead-to-pump-suction drop (SUB-PWH 3 bar(g)
      → SUB-PSUC 0 bar(g)) is put into the degasser (gas separates at the lowest pressure), so the injection pump
      sees the same suction as TL-05; filters and plate HEX have zero resistance, and every surface component is
      adiabatic, so the brine-side balance (verifier PH-22) closes exactly. In the pressurised loop (C7) there is
      no letdown and the brine reaches the injector at the producer WHP. Brine above 100 °C (C4 at 3.2 km) let
      down to 0 bar(g) may flash; the generator flags it (no saturation data in RC-01).
    source: SUB-PWH, SUB-PSUC (WP-05); RC-03 control valve at the HEX outlet (Guidebook p.234) [A]
    sensitivity: "Filter/HEX Δp 24 kPa/NTU (RC-03 eq 4) moved from the letdown to the HEX; 1 K surface heat loss."
    tag: A
    status: default
    added_by: WP-06

