      standing loss would double count it. Candidate C6 (seasonal HT-ATES) uses this value.
    source: RC-09 Thermal storage [L TU Delft HT-ATES]; split on discharge [A]
    sensitivity: "0.5 / 0.75 (early years recover less)"
