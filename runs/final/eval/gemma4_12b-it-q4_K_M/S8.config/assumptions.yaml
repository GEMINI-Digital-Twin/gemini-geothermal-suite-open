  - id: HP-ETA-L
    title: Heat-pump Lorenz efficiency η_L on water temperatures
    value: 0.5
    unit: "-"
    justification: >-
      RC-04 eq. 2: COP = η_L · T̄_sink / (T̄_sink − T̄_source) with log-mean water temperatures; η_L 0.50 [A] is
      the RC-04 default and GEMINI's eta_lorenz default (the Guidebook point implies η_Carnot ≈ 0.46 on the
      Carnot basis). Used by gemini_model.heatpump in both solvers. At the large glides of the design case
      (sink 82→100 °C, brine 60→46 °C, mean lift 38 K) η_L 0.5 gives COP 4.79, above the RC-04 default cap
      0.6 × Carnot at the refrigerant temperatures (VER-HP-ETA): the closed-form path applies that cap. The
      capped pump draws less brine heat, so the brine leaves at 47.1 °C (not 46) and COP = 3.71 (RC-04
      expects 3.5–4.5; DEA 3.57 at the same 52.9 K lift, plausibility only). While the cap binds (here for
      η_L ≥ ≈ 0.39) η_L has no effect: the COP is set by VER-HP-ETA and HP-APPROACH, so run the sensitivity
      on those; η_L matters only on the Nelder-Mead path or with apply_cop_cap false.
    source: RC-04 parameter table (η_L default 0.50 [A]); GEMINI heatpump_basic default
    sensitivity: [0.40, 0.55]
    tag: A
    status: default
    added_by: WP-03

  - id: HP-APPROACH
    title: Heat-pump evaporator and condenser approach (refrigerant vs water outlet)
    value:
      condenser_approach_k: 4.0
      evaporator_approach_k: 4.0
    unit: K
    justification: >-
      RC-04 eq. 4: approach 3–5 K [A]; mid-point used (as COOL-ABS-B). Condensing = sink outlet + 4 K,
      evaporating = source outlet − 4 K. gemini_model.heatpump reports them as the DesignVerifier's
      HeatPumpPoint evidence (PH-13/PH-14) and evaluates the VER-HP-ETA cap there. The Lorenz COP itself
      is on water temperatures (η_L absorbs the approach losses), so the approach changes only the cap.
    source: RC-04 eq. 4 [A]
    sensitivity: "3 / 5 K (capped COP at the design case 3.82 / 3.61)"
    tag: A
    status: default
    added_by: WP-03

