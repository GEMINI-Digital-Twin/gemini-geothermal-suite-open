[tool.poetry]
name = "gemini-geothermal-suite-open"
version = "1.0.0"
description = "Open Source suite of the GEMINI Geothermal Digital Twin"
authors = [ "Ryvo Octaviano <ryvo.octaviano@tno.nl>",
    "Leila Hashemi <leila.hashemi@tno.nl>",
    "Demetris Palochis <demetris.palochis@tno.nl>",
    "Arturs Blinovs <arturs.blinovs@we-p.nl>"
]
readme = "README.md"
package-mode = false
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development"
]
homepage = "https://nwn.nu/projecten/innovaties/datagedreven-optimalisatie-aardwarmte-systemen/"
documentation = "https://github.com/GEMINI-Digital-Twin/gemini-geothermal-suite-open"
repository = "https://github.com/GEMINI-Digital-Twin/gemini-geothermal-suite-open"

[tool.poetry.dependencies]
python = "^3.11, <3.13"
pandas = "2.3.3"
scipy = "1.13.1"
numpy = "2.2.6"
chromadb = "1.3.5"
langchain-community = "0.3.31"
ollama= "0.5.4"
lasio = "0.31"
ruptures = "1.1.9"
langchain-openai = "0.3.28"
influxdb-client = "1.49.0"
pytz = "2024.2"
adh-sample-library-preview = "0.10.19rc0"
matplotlib = "3.10.7"
requests = "2.32.5"
Flask = "2.3.3"
Flask-SQLAlchemy = "3.1.1"
Flask-Login = "0.6.3"
Flask-SocketIO = "5.5.1"
flask_session = "0.5.0"
Flask-Migrate = "4.1.0"
werkzeug = "2.3.8"
flask-admin = "1.6.1"
celery = "5.5.3"
redis = "5.3.1"
flower = "2.0.1"
pymongo = "4.15.4"
GitPython = "3.1.44"
pymysql="1.1.2"
cryptography="46.0.3"
scikit-learn = "1.8.0"
joblib = "1.5.3"
openpyxl = "3.1.5"
langid = "1.1.6"
pypdf = "^6.14.2"
python-dotenv = "^1.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-cov = "5.0.0"
flake8 = "7.3.0"
flake8-docstrings = "1.7.0"
black = "25.11.0"
isort = "7.0.0"
Flake8-pyproject = "1.2.3"
myst-parser = "3.0.1"
sphinx = "7.4.7"
sphinx-rtd-theme = "2.0.0"
sphinx-autodoc-typehints = "2.3.0"


[tool.flake8]
extend-ignore = ["W503", "W504", "E127", "E128", "E203", "E402", "E722"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = "src"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
