{% extends "base.html" %}

{% block title %}

<div class="col-lg-12">
    <h1 class="page-header">Parameters overview</h1>
</div>

{% endblock %}

{% block content %}
<div class="col-lg-12">
    <label style="color: white">Choose a component</label>
    <select class='form-control' style="width:200px; color:white" id='select_component' value="">
    </select>
    <br>
</div>


<div class="col-lg-6">
    <h2 class="page-header">Parameters</h2>
    <label style="color: white">Timestamps</label>
    <select class='form-control' style='width: 200px' id='select_parameters_timestamps' value="">
    </select>
    <div class="card ">
        <div class="card-body">
            <table class="table table-bordered parameters_table_class">
                <tbody>
                    <div id="parametersTable">
                        <!-- Table will be dynamically inserted here -->
                    </div>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="col-lg-6">
    <h2 class="page-header">Tagnames</h2>
    <label style="color: white">Timestamps</label>
    <select class='form-control' style='width: 200px' id='select_tagnames_timestamps' value="">
    </select>
    <div class="card ">
        <div class="card-body">
            <table class="table table-bordered parameters_table_class">
                <tbody>
                    <div id="tagnamesTable">
                    </div>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- <input type="button" id="update" value="Update" onclick="update_parameters_tagnames();" class="btn btn-default btn-sm"></td> -->
{% endblock %}

{% block script %}

<script src="{{ url_for('static', filename='page/app_parameters_overview/js/api.js') }}"></script>

<script src="{{ url_for('static', filename='vendor/dataTables/jquery.dataTables.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/dataTables/dataTables.bootstrap.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/dataTables/jquery.dataTables.min.js') }}"></script>


<link href="{{ url_for('static', filename='vendor/dataTables/dataTables.bootstrap.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='vendor/dataTables/dataTables.responsive.css') }}" rel="stylesheet">

{% endblock %}
