<polyline points="350,225 385,225 385,165 408,165" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#brine)"/>
<text x="360" y="160" font-size="11.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">brine</text>
<polyline points="385,225 385,295 408,295" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#brine)"/>
<polyline points="490,200 490,240 595,240 595,360 100,360 100,398" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#brine)"/>
<text x="215" y="352" font-size="11.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">cooled brine, 62 C</text>
<polyline points="490,330 490,360" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#brine)"/>
<polyline points="570,165 628,165" fill="none" stroke="#eb6834" stroke-width="2.5" marker-end="url(#gas)"/>
<text x="582" y="156" font-size="11.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">water</text>
<polyline points="360,95 700,95 700,128" fill="none" stroke="#eb6834" stroke-width="2.5" marker-end="url(#gas)"/>
<text x="440" y="88" font-size="11.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">CHP heat 12.3 GWh</text>
<polyline points="770,165 818,165" fill="none" stroke="#eb6834" stroke-width="2.5" marker-end="url(#gas)"/>
<polyline points="570,295 628,295" fill="none" stroke="#1baf7a" stroke-width="2.5" marker-end="url(#cool)"/>
<text x="574" y="286" font-size="11.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">hot water</text>
<polyline points="770,295 795,295 795,325 818,325" fill="none" stroke="#1baf7a" stroke-width="2.5" marker-end="url(#cool)"/>
<polyline points="770,415 795,415 795,345 818,345" fill="none" stroke="#1baf7a" stroke-width="2.5" marker-end="url(#cool)"/>
<polyline points="220,115 200,115 200,515 700,515 700,452" fill="none" stroke="#52514e" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#power)"/>
<text x="215" y="508" font-size="11.5" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">CHP electricity 6.2 GWh: pumps and chillers</text>
<polyline points="820,470 772,440" fill="none" stroke="#52514e" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#power)"/>
<text x="20" y="535" font-size="11.5" fill="#52514e">Blue: brine. Orange: produced gas and the heat it makes. Green: cooling. Dashed: electricity. Annual values for 2027 from the yearly model.</text>
